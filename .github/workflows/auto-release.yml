name: Auto Release

on:
  push:
    branches:
      - main

  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  job-on-push:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Step 1: 检出当前仓库代码
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: 发布至 GitHub
      - name: Update Release
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          python ./build.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "Files are different, committing changes..."
            git config --global user.name "$GIT_NAME"
            git config --global user.email "$GIT_EMAIL"
            git add .
            git commit -m "Update package at $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "Files are the same, no changes."
          fi
          VERSION=$(cat ./wemediamon/version)
          python ./.github/delete.py --token "$GIT_TOKEN" --ver "$VERSION" 
          python ./.github/release.py --token "$GIT_TOKEN" --ver "$VERSION"
